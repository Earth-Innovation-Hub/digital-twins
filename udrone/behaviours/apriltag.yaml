# apriltag_ros on otter_k / xudrone cameras (Locutus twin.launch pattern).
# Tags: 36h11, 0.40 m. Id 0 is the cube at ENU (5, 4). Id 10 is the tag
# centered on the underside of the Heron deck. One size fits both.
/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.4
    max_hamming: 0
    qos_profile: default
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    pose_estimation_method: pnp
