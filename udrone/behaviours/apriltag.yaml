# apriltag_ros on otter_k / xudrone cameras (Locutus twin.launch pattern).
# Tags: 36h11, 0.40 m. Id 0 is the cube at ENU (5, 4). Id 10 is the tag
# centered on the underside of the Heron deck. One size fits both.
# Ids 11 and 12 are the 0.14 m tags on the Heron pontoon sterns. The
# pontoon is 0.24 m across, so the tag sits inside that circle. Their own
# size keeps the TF range right.
/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.4
    tag:
      ids: [11, 12]
      sizes: [0.14, 0.14]
    max_hamming: 0
    qos_profile: default
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    pose_estimation_method: pnp
