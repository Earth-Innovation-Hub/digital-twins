# apriltag_ros on otter_k's fixed down-camera (Locutus twin.launch pattern).
# Tag: 36h11 id 0, 0.8 m edge on the Kiwanis lake bed at ENU (5, 4, z≈-2.08).
/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.8
    max_hamming: 0
    qos_profile: default
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    pose_estimation_method: pnp
